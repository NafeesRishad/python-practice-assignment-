
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafees Rishad | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .portfolio {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 350px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .info {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .info a {
            color: white;
            text-decoration: none;
        }

        .info a:hover {
            color: #38bdf8;
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #cbd5e1;
        }
    </style>
</head>

<body>

    <div class="portfolio">

        <img src="Nafees.jpg"
             alt="Nafees Rishad"
             class="profile-img">

        <h1>Nafees Rishad</h1>

        <p class="subtitle">Welcome to My Portfolio</p>

        <div class="info">
            📧 Email:
            <a href="mailto:nrishad@yahoo.com">

            </a>
        </div>

        <div class="info">
            📞 Mobile:

                +8801715123947</a>
        </div>

        <footer>

        </footer>

    </div>

</body>
</html>
